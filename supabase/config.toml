project_id = "quali-excel-trainer"

[auth]
# Students now sign in with a real Supabase Auth account (name + a
# teacher-issued 6-digit code — src/backend/studentAuth.ts), provisioned by
# the teacher through the manage-student Edge Function. Anonymous sign-in was
# the mechanism before that and has no remaining callers — explicitly off
# rather than just unused, since it's otherwise callable by anyone with the
# anon key straight from devtools.
enable_anonymous_sign_ins = false

# `config push` fills in every *unlisted* auth field with the CLI's stock
# local-dev defaults, including site_url — which is exactly what a password
# recovery or invite email redirects to. Left unlisted once, it silently
# became `http://127.0.0.1:3000`, a server that doesn't exist for anyone,
# and broke the teacher account's password reset. Explicit from here on.
site_url = "https://hanneskl.github.io/Engineering-Class/"
additional_redirect_urls = [
  "https://hanneskl.github.io/Engineering-Class/",
  "http://localhost:5173/Engineering-Class/",
]

# Both functions already verify the caller's JWT themselves (`auth.getUser()`
# against their own Authorization header) and need to answer an unauthenticated
# CORS preflight (OPTIONS, which carries no token at all) — the platform-level
# gate this flag adds runs *before* either function's own code, rejecting that
# preflight outright and surfacing as a bare "Failed to send a request" on the
# client with no further detail.
[functions.check-task]
verify_jwt = false

[functions.manage-student]
verify_jwt = false
