<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="Übungen zu Netzwerken, Binärzahlen und Tabellenkalkulation für den Quali in Informatik." />
    <title>Informatik-Trainer — Quali 9</title>
    <script>
      // Same rule as src/theme.ts, run before the first paint so a dark-mode
      // student never sees the light palette flash while the app loads.
      try {
        var t = localStorage.getItem('netzwerk-trainer:theme')
        if (t !== 'dark' && t !== 'light') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
